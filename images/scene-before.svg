<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Санузел до ремонта — бетон и демонтаж">
  <defs>
    <linearGradient id="bfBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8a85"/>
      <stop offset="1" stop-color="#6f6c67"/>
    </linearGradient>
    <linearGradient id="bfLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55524d"/>
      <stop offset="1" stop-color="#7c7973"/>
    </linearGradient>
    <linearGradient id="bfRight2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4f4c47"/>
      <stop offset="1" stop-color="#777570"/>
    </linearGradient>
    <linearGradient id="bfCeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6863"/>
      <stop offset="1" stop-color="#565350"/>
    </linearGradient>
    <linearGradient id="bfFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a756c"/>
      <stop offset="1" stop-color="#5d584f"/>
    </linearGradient>
    <radialGradient id="bfLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffe9ad" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bfVignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
  </defs>

  <!-- ===== Та же геометрия комнаты ===== -->
  <polygon points="0,0 1000,0 720,92 280,92" fill="url(#bfCeil)"/>
  <polygon points="0,0 280,92 280,566 0,720" fill="url(#bfLeft)"/>
  <polygon points="1000,0 720,92 720,566 1000,720" fill="url(#bfRight2)"/>
  <polygon points="280,566 720,566 1000,720 0,720" fill="url(#bfFloor)"/>
  <rect x="280" y="92" width="440" height="474" fill="url(#bfBack)"/>

  <!-- пятна сырости / неровный бетон на задней стене -->
  <g opacity="0.5">
    <ellipse cx="400" cy="200" rx="70" ry="46" fill="#605d58"/>
    <ellipse cx="600" cy="300" rx="90" ry="60" fill="#7d7a74"/>
    <ellipse cx="520" cy="430" rx="60" ry="40" fill="#615e59"/>
  </g>
  <!-- участок старой кладки (содранная плитка) -->
  <g opacity="0.85">
    <rect x="300" y="120" width="150" height="160" fill="#9a6a52"/>
    <g stroke="#6f4636" stroke-width="3">
      <line x1="300" y1="150" x2="450" y2="150"/>
      <line x1="300" y1="180" x2="450" y2="180"/>
      <line x1="300" y1="210" x2="450" y2="210"/>
      <line x1="300" y1="240" x2="450" y2="240"/>
      <line x1="340" y1="120" x2="340" y2="280"/>
      <line x1="390" y1="120" x2="390" y2="280"/>
      <line x1="430" y1="120" x2="430" y2="280"/>
    </g>
  </g>

  <!-- штроба под проводку с кабелями -->
  <path d="M560 110 L560 250 L520 360 L560 470" fill="none" stroke="#3c3a36" stroke-width="14" opacity="0.8"/>
  <path d="M566 110 L566 250 L526 360 L566 470" fill="none" stroke="#b8453e" stroke-width="3"/>
  <path d="M556 112 L556 252 L516 362 L556 470" fill="none" stroke="#3a6fb0" stroke-width="3"/>
  <!-- свисающие провода из стены -->
  <path d="M640 92 q6 40 -10 70 q-14 26 6 50" fill="none" stroke="#c2b53a" stroke-width="4"/>
  <path d="M654 92 q10 44 -6 78" fill="none" stroke="#b8453e" stroke-width="4"/>
  <rect x="624" y="92" width="40" height="16" fill="#2c2a27"/>

  <!-- торчащая труба (там, где будет раковина) -->
  <rect x="486" y="430" width="16" height="60" fill="#8a8580"/>
  <rect x="478" y="424" width="32" height="12" rx="2" fill="#b8b2aa"/>
  <circle cx="494" cy="430" r="9" fill="#5a564f"/>
  <!-- старый слив в полу -->
  <ellipse cx="500" cy="650" rx="26" ry="11" fill="#403d38"/>
  <ellipse cx="500" cy="649" rx="16" ry="6" fill="#2c2a26"/>

  <!-- неровная стяжка: трещины и швы пола -->
  <g stroke="#4a463f" stroke-width="2" opacity="0.6">
    <line x1="0" y1="720" x2="316" y2="566"/>
    <line x1="500" y1="720" x2="500" y2="566"/>
    <line x1="1000" y1="720" x2="684" y2="566"/>
    <line x1="150" y1="610" x2="850" y2="610"/>
  </g>
  <path d="M300 700 l60 -50 l-20 -34 l50 -40" fill="none" stroke="#403d37" stroke-width="2" opacity="0.7"/>

  <!-- мусор / куски плитки на полу -->
  <g>
    <polygon points="360,648 408,636 420,664 372,676" fill="#b9b2a8"/>
    <polygon points="360,648 408,636 412,650 366,660" fill="#cfc8be"/>
    <polygon points="600,620 636,612 646,634 610,642" fill="#9a6a52"/>
    <polygon points="640,668 690,658 700,682 650,694" fill="#a59d92"/>
    <polygon points="250,672 300,690 270,706 224,690" fill="#8c857a"/>
    <rect x="430" y="676" width="60" height="14" rx="2" fill="#7d7670" transform="rotate(-6 460 683)"/>
  </g>
  <!-- мешок со смесью -->
  <path d="M716 600 q-6 -54 30 -58 q36 4 30 58 z" fill="#c9c2b4"/>
  <path d="M716 600 q-6 -54 30 -58 q36 4 30 58 z" fill="none" stroke="#a59d8c" stroke-width="2"/>
  <rect x="724" y="556" width="44" height="10" rx="3" fill="#9a937f"/>

  <!-- стремянка-силуэт у левой стены -->
  <g stroke="#4a4641" stroke-width="6" fill="none" opacity="0.92" stroke-linecap="round">
    <line x1="150" y1="360" x2="120" y2="600"/>
    <line x1="210" y1="360" x2="234" y2="600"/>
    <line x1="156" y1="408" x2="204" y2="408"/>
    <line x1="150" y1="470" x2="216" y2="470"/>
    <line x1="142" y1="535" x2="226" y2="535"/>
  </g>

  <!-- временная лампа-прожектор на штативе -->
  <g>
    <line x1="838" y1="300" x2="838" y2="560" stroke="#3a3833" stroke-width="5"/>
    <line x1="838" y1="560" x2="808" y2="600" stroke="#3a3833" stroke-width="5"/>
    <line x1="838" y1="560" x2="868" y2="600" stroke="#3a3833" stroke-width="5"/>
    <rect x="812" y="276" width="52" height="30" rx="4" fill="#2c2a26"/>
    <circle cx="838" cy="291" r="60" fill="url(#bfLamp)"/>
    <rect x="816" y="280" width="44" height="22" rx="3" fill="#fff3c8" opacity="0.9"/>
  </g>

  <!-- голая лампочка на проводе с потолка -->
  <line x1="430" y1="92" x2="430" y2="180" stroke="#2c2a27" stroke-width="2"/>
  <circle cx="430" cy="190" r="13" fill="url(#bfLamp)"/>
  <circle cx="430" cy="190" r="7" fill="#fff4cc"/>

  <!-- пыльная дымка + виньетка -->
  <rect x="0" y="0" width="1000" height="720" fill="#6b665d" opacity="0.06"/>
  <rect x="0" y="0" width="1000" height="720" fill="url(#bfVignette)"/>
</svg>
