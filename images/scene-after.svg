<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Санузел после ремонта под ключ">
  <defs>
    <linearGradient id="aWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e2d6"/>
      <stop offset="1" stop-color="#d8cdbb"/>
    </linearGradient>
    <linearGradient id="aFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdbfa8"/>
      <stop offset="1" stop-color="#b6a587"/>
    </linearGradient>
    <linearGradient id="aStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#e7e2d8"/>
    </linearGradient>
    <linearGradient id="aWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c343a"/>
      <stop offset="1" stop-color="#1d2329"/>
    </linearGradient>
    <linearGradient id="aBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c98c"/>
      <stop offset="1" stop-color="#bd9a5a"/>
    </linearGradient>
    <radialGradient id="aMirror" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#cfe9ee"/>
      <stop offset="0.7" stop-color="#a9cdd6"/>
      <stop offset="1" stop-color="#8fb6c0"/>
    </radialGradient>
    <radialGradient id="aGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe3f0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fe3f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#aWall)"/>
  <!-- large-format tile grout lines -->
  <g opacity="0.45">
    <g stroke="#c3b6a0" stroke-width="2">
      <line x1="0" y1="150" x2="1000" y2="150"/>
      <line x1="0" y1="320" x2="1000" y2="320"/>
      <line x1="0" y1="470" x2="1000" y2="470"/>
      <line x1="250" y1="0" x2="250" y2="600"/>
      <line x1="520" y1="0" x2="520" y2="600"/>
      <line x1="760" y1="0" x2="760" y2="600"/>
    </g>
  </g>

  <!-- floor -->
  <rect x="0" y="600" width="1000" height="120" fill="url(#aFloor)"/>
  <g stroke="#a4937a" stroke-width="2" opacity="0.5">
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="120" y1="600" x2="60" y2="720"/>
    <line x1="340" y1="600" x2="300" y2="720"/>
    <line x1="560" y1="600" x2="540" y2="720"/>
    <line x1="780" y1="600" x2="800" y2="720"/>
    <line x1="980" y1="600" x2="1010" y2="720"/>
  </g>

  <!-- feature mosaic strip (right) -->
  <rect x="812" y="0" width="120" height="600" fill="#22414a" opacity="0.9"/>
  <g fill="#2f5560" opacity="0.8">
    <rect x="820" y="20" width="48" height="48"/>
    <rect x="876" y="20" width="48" height="48"/>
    <rect x="820" y="76" width="48" height="48"/>
    <rect x="876" y="76" width="48" height="48"/>
  </g>
  <g fill="#3c6f7c" opacity="0.55">
    <rect x="848" y="160" width="40" height="40"/>
    <rect x="820" y="300" width="40" height="40"/>
    <rect x="884" y="420" width="40" height="40"/>
  </g>

  <!-- floating vanity -->
  <rect x="300" y="430" width="360" height="120" rx="8" fill="url(#aWood)"/>
  <rect x="300" y="408" width="360" height="34" rx="6" fill="url(#aStone)"/>
  <line x1="480" y1="450" x2="480" y2="540" stroke="#10151a" stroke-width="2" opacity="0.5"/>
  <circle cx="430" cy="495" r="5" fill="url(#aBrass)"/>
  <circle cx="530" cy="495" r="5" fill="url(#aBrass)"/>
  <!-- shadow under vanity -->
  <ellipse cx="480" cy="600" rx="210" ry="14" fill="#000" opacity="0.12"/>

  <!-- undermount sink basin -->
  <ellipse cx="480" cy="424" rx="86" ry="15" fill="#cdc6b8"/>
  <ellipse cx="480" cy="421" rx="80" ry="12" fill="#f3efe8"/>

  <!-- brass faucet -->
  <path d="M480 408 L480 360 Q480 350 490 350 L516 350" fill="none" stroke="url(#aBrass)" stroke-width="7" stroke-linecap="round"/>
  <rect x="474" y="404" width="12" height="10" rx="2" fill="url(#aBrass)"/>

  <!-- round backlit mirror -->
  <circle cx="480" cy="210" r="120" fill="url(#aGlow)" opacity="0.55"/>
  <circle cx="480" cy="205" r="104" fill="#0c1418"/>
  <circle cx="480" cy="205" r="98" fill="url(#aMirror)"/>
  <circle cx="480" cy="205" r="98" fill="none" stroke="#e8e0d2" stroke-width="3" opacity="0.4"/>
  <path d="M455 250 q35 -26 70 -64" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.25" fill="none"/>

  <!-- sconces -->
  <g fill="url(#aBrass)">
    <rect x="316" y="180" width="10" height="60" rx="4"/>
    <circle cx="321" cy="170" r="12" fill="#fff6df"/>
    <rect x="674" y="180" width="10" height="60" rx="4"/>
    <circle cx="679" cy="170" r="12" fill="#fff6df"/>
  </g>

  <!-- plant -->
  <rect x="600" y="392" width="40" height="20" rx="4" fill="#b9824d"/>
  <g fill="#2f6b4f">
    <path d="M620 392 q-26 -40 -8 -78 q14 30 8 78"/>
    <path d="M620 392 q26 -34 12 -70 q-18 28 -12 70"/>
    <path d="M620 392 q-2 -48 2 -84 q10 40 -2 84"/>
  </g>

  <!-- rolled towel -->
  <g>
    <rect x="330" y="392" width="56" height="18" rx="9" fill="#eef1f3"/>
    <rect x="330" y="392" width="56" height="18" rx="9" fill="none" stroke="#cdd3d6" stroke-width="2"/>
  </g>

  <!-- glass shower hint (left edge) -->
  <rect x="40" y="120" width="150" height="480" fill="#bcd6da" opacity="0.16"/>
  <rect x="40" y="120" width="6" height="480" fill="url(#aBrass)" opacity="0.8"/>
  <circle cx="115" cy="150" r="22" fill="none" stroke="url(#aBrass)" stroke-width="5"/>
  <line x1="115" y1="172" x2="115" y2="200" stroke="url(#aBrass)" stroke-width="4"/>
</svg>
