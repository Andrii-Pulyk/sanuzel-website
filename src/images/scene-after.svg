<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Санузел после ремонта под ключ — перспектива">
  <defs>
    <!-- Материалы -->
    <linearGradient id="afBackWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9df"/>
      <stop offset="1" stop-color="#ddd3c3"/>
    </linearGradient>
    <linearGradient id="afLeftWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc6b6"/>
      <stop offset="1" stop-color="#e7e0d4"/>
    </linearGradient>
    <linearGradient id="afRightWall" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c7beae"/>
      <stop offset="1" stop-color="#e4ddd1"/>
    </linearGradient>
    <linearGradient id="afCeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e2d8"/>
      <stop offset="1" stop-color="#cfc7b9"/>
    </linearGradient>
    <linearGradient id="afFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcae97"/>
      <stop offset="1" stop-color="#9c8d72"/>
    </linearGradient>
    <linearGradient id="afCounter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/>
      <stop offset="1" stop-color="#e6dfd2"/>
    </linearGradient>
    <linearGradient id="afVanity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d353c"/>
      <stop offset="1" stop-color="#171c21"/>
    </linearGradient>
    <linearGradient id="afBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d49a"/>
      <stop offset="0.5" stop-color="#cda865"/>
      <stop offset="1" stop-color="#a9853f"/>
    </linearGradient>
    <radialGradient id="afMirror" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#2b3a40"/>
      <stop offset="0.6" stop-color="#1a2429"/>
      <stop offset="1" stop-color="#0e1519"/>
    </radialGradient>
    <radialGradient id="afMirrorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="afWarm" cx="0.5" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#fff3d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="afGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff0f4" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#bcd9e0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e8f5f7" stop-opacity="0.26"/>
    </linearGradient>
    <radialGradient id="afVignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="afFloorShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ===== Геометрия комнаты (одноточечная перспектива, VP ~ 500,330) ===== -->
  <!-- Потолок -->
  <polygon points="0,0 1000,0 720,92 280,92" fill="url(#afCeil)"/>
  <!-- Левая стена -->
  <polygon points="0,0 280,92 280,566 0,720" fill="url(#afLeftWall)"/>
  <!-- Правая стена -->
  <polygon points="1000,0 720,92 720,566 1000,720" fill="url(#afRightWall)"/>
  <!-- Пол -->
  <polygon points="280,566 720,566 1000,720 0,720" fill="url(#afFloor)"/>
  <!-- Задняя стена -->
  <rect x="280" y="92" width="440" height="474" fill="url(#afBackWall)"/>

  <!-- Швы крупноформатной плитки на задней стене -->
  <g stroke-width="1.5" opacity="0.5">
    <g stroke="#c6b9a3">
      <line x1="280" y1="250" x2="720" y2="250"/>
      <line x1="280" y1="410" x2="720" y2="410"/>
      <line x1="427" y1="92" x2="427" y2="566"/>
      <line x1="573" y1="92" x2="573" y2="566"/>
    </g>
  </g>

  <!-- Перспективные швы пола (сходятся к VP 500,330) -->
  <g stroke="#7e7159" stroke-width="2" opacity="0.45">
    <line x1="0" y1="720" x2="316" y2="566"/>
    <line x1="250" y1="720" x2="392" y2="566"/>
    <line x1="500" y1="720" x2="500" y2="566"/>
    <line x1="750" y1="720" x2="608" y2="566"/>
    <line x1="1000" y1="720" x2="684" y2="566"/>
  </g>
  <g stroke="#8a7c63" stroke-width="2" opacity="0.4">
    <line x1="150" y1="600" x2="850" y2="600"/>
    <line x1="64" y1="660" x2="936" y2="660"/>
  </g>
  <!-- Лёгкий блик-отражение на полу -->
  <polygon points="360,566 640,566 720,720 280,720" fill="url(#afFloorShine)"/>

  <!-- Перспективные швы плитки на левой стене -->
  <g stroke="#b3a890" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="250" x2="280" y2="262"/>
    <line x1="0" y1="470" x2="280" y2="438"/>
    <line x1="95" y1="32" x2="95" y2="668"/>
    <line x1="190" y1="62" x2="190" y2="618"/>
  </g>
  <!-- Перспективные швы плитки на правой стене (зона душа) -->
  <g stroke="#b0a48c" stroke-width="1.5" opacity="0.4">
    <line x1="1000" y1="250" x2="720" y2="262"/>
    <line x1="1000" y1="470" x2="720" y2="438"/>
    <line x1="905" y1="32" x2="905" y2="668"/>
    <line x1="810" y1="62" x2="810" y2="618"/>
  </g>

  <!-- ===== ДУШЕВАЯ ЗОНА (правая стена) ===== -->
  <!-- ниша с подсветкой -->
  <rect x="772" y="300" width="120" height="150" fill="#26333a"/>
  <rect x="772" y="300" width="120" height="150" fill="none" stroke="#3a4a52" stroke-width="2"/>
  <line x1="772" y1="375" x2="892" y2="375" stroke="#46585f" stroke-width="2"/>
  <rect x="790" y="318" width="26" height="46" rx="3" fill="#cdd6d8"/>
  <rect x="822" y="330" width="20" height="34" rx="3" fill="#b7c1c3"/>
  <rect x="790" y="392" width="34" height="42" rx="3" fill="#dfe6e7"/>
  <!-- тропический душ -->
  <rect x="828" y="150" width="64" height="9" rx="3" fill="url(#afBrass)"/>
  <rect x="855" y="159" width="8" height="26" fill="url(#afBrass)"/>
  <ellipse cx="859" cy="150" rx="34" ry="6" fill="url(#afBrass)"/>
  <!-- стеклянная перегородка душа -->
  <polygon points="720,150 720,566 612,620 612,210" fill="url(#afGlass)"/>
  <polygon points="720,150 720,566 612,620 612,210" fill="none" stroke="#cfe6ea" stroke-width="2" opacity="0.5"/>
  <rect x="713" y="150" width="7" height="416" fill="url(#afBrass)" opacity="0.85"/>
  <line x1="666" y1="180" x2="666" y2="593" stroke="#eaf6f8" stroke-width="2" opacity="0.25"/>

  <!-- ===== ЗАДНЯЯ СТЕНА: тумба + зеркало ===== -->
  <!-- тёплое свечение от ламп -->
  <rect x="280" y="92" width="440" height="280" fill="url(#afWarm)"/>

  <!-- зеркало с контурной подсветкой -->
  <circle cx="500" cy="232" r="118" fill="url(#afMirrorGlow)" opacity="0.6"/>
  <circle cx="500" cy="228" r="100" fill="#0a1014"/>
  <circle cx="500" cy="228" r="94" fill="url(#afMirror)"/>
  <circle cx="500" cy="228" r="98" fill="none" stroke="#ffedcb" stroke-width="3" opacity="0.55"/>
  <path d="M455 285 q40 -34 78 -92" stroke="#cfe2e8" stroke-width="11" stroke-linecap="round" opacity="0.18" fill="none"/>
  <path d="M470 300 q26 -20 50 -54" stroke="#eef6f8" stroke-width="5" stroke-linecap="round" opacity="0.2" fill="none"/>

  <!-- настенные бра по бокам зеркала -->
  <g>
    <rect x="372" y="196" width="9" height="64" rx="4" fill="url(#afBrass)"/>
    <circle cx="376.5" cy="186" r="13" fill="#fff4dc"/>
    <circle cx="376.5" cy="186" r="22" fill="#fff0cf" opacity="0.25"/>
    <rect x="619" y="196" width="9" height="64" rx="4" fill="url(#afBrass)"/>
    <circle cx="623.5" cy="186" r="13" fill="#fff4dc"/>
    <circle cx="623.5" cy="186" r="22" fill="#fff0cf" opacity="0.25"/>
  </g>

  <!-- парящая тумба -->
  <rect x="372" y="430" width="256" height="86" rx="6" fill="url(#afVanity)"/>
  <rect x="372" y="412" width="256" height="24" rx="4" fill="url(#afCounter)"/>
  <line x1="500" y1="446" x2="500" y2="510" stroke="#0c1014" stroke-width="2" opacity="0.5"/>
  <rect x="454" y="470" width="20" height="4" rx="2" fill="url(#afBrass)"/>
  <rect x="526" y="470" width="20" height="4" rx="2" fill="url(#afBrass)"/>
  <!-- мягкая тень под тумбой на стене/полу -->
  <ellipse cx="500" cy="528" rx="150" ry="12" fill="#000" opacity="0.18"/>

  <!-- накладная раковина -->
  <rect x="452" y="398" width="96" height="20" rx="9" fill="#efe9df"/>
  <rect x="452" y="398" width="96" height="20" rx="9" fill="none" stroke="#cfc6b6" stroke-width="2"/>
  <ellipse cx="500" cy="408" rx="38" ry="7" fill="#d7cfc1"/>
  <!-- латунный смеситель -->
  <path d="M500 398 L500 356 Q500 348 508 348 L528 348" fill="none" stroke="url(#afBrass)" stroke-width="6" stroke-linecap="round"/>
  <rect x="495" y="394" width="10" height="8" rx="2" fill="url(#afBrass)"/>

  <!-- декор на столешнице -->
  <rect x="398" y="396" width="46" height="16" rx="8" fill="#eef1f3"/>
  <rect x="398" y="396" width="46" height="16" rx="8" fill="none" stroke="#d2d7da" stroke-width="1.5"/>
  <rect x="566" y="386" width="30" height="26" rx="4" fill="#b07a45"/>
  <g fill="#2f6b4f">
    <path d="M581 386 q-22 -34 -7 -66 q12 26 7 66"/>
    <path d="M581 386 q22 -28 10 -58 q-15 24 -10 58"/>
    <path d="M581 386 q-2 -40 2 -70 q9 34 -2 70"/>
  </g>

  <!-- полотенцесушитель на левой стене -->
  <g stroke="url(#afBrass)" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="120" y1="330" x2="120" y2="470"/>
    <line x1="120" y1="345" x2="172" y2="349"/>
    <line x1="120" y1="385" x2="174" y2="388"/>
    <line x1="120" y1="425" x2="172" y2="427"/>
  </g>
  <rect x="118" y="392" width="60" height="40" rx="6" fill="#eef1f3" opacity="0.92"/>

  <!-- ===== Атмосфера / свет ===== -->
  <!-- линия подсветки в нише потолка -->
  <polygon points="300,92 700,92 690,80 310,80" fill="#fff6e0" opacity="0.5"/>
  <!-- вертикальный тёплый луч из центра потолка -->
  <polygon points="470,92 530,92 560,300 440,300" fill="#fff3d8" opacity="0.10"/>

  <!-- виньетка для глубины -->
  <rect x="0" y="0" width="1000" height="720" fill="url(#afVignette)"/>
</svg>
