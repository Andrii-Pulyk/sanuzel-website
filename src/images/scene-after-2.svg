<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Санузел после ремонта — тёплая гамма">
  <defs>
    <linearGradient id="a2Back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe2d2"/>
      <stop offset="1" stop-color="#dcc9b2"/>
    </linearGradient>
    <linearGradient id="a2Left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdb89d"/>
      <stop offset="1" stop-color="#e8dac6"/>
    </linearGradient>
    <linearGradient id="a2Right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c5b095"/>
      <stop offset="1" stop-color="#e4d6c1"/>
    </linearGradient>
    <linearGradient id="a2Ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece0d0"/>
      <stop offset="1" stop-color="#d2c2ac"/>
    </linearGradient>
    <linearGradient id="a2Floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b59874"/>
      <stop offset="1" stop-color="#94785a"/>
    </linearGradient>
    <linearGradient id="a2Counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#e3d6c3"/>
    </linearGradient>
    <linearGradient id="a2Wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6b40"/>
      <stop offset="1" stop-color="#6f4828"/>
    </linearGradient>
    <linearGradient id="a2Brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f22"/>
      <stop offset="1" stop-color="#0d0f11"/>
    </linearGradient>
    <radialGradient id="a2MirrorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6bb" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe6bb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a2Mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33373a"/>
      <stop offset="0.6" stop-color="#1d2123"/>
      <stop offset="1" stop-color="#101315"/>
    </linearGradient>
    <radialGradient id="a2Warm" cx="0.5" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#fff0d2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff0d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a2Glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f1f2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#dfeef0" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="a2Vignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <polygon points="0,0 1000,0 720,92 280,92" fill="url(#a2Ceil)"/>
  <polygon points="0,0 280,92 280,566 0,720" fill="url(#a2Left)"/>
  <polygon points="1000,0 720,92 720,566 1000,720" fill="url(#a2Right)"/>
  <polygon points="280,566 720,566 1000,720 0,720" fill="url(#a2Floor)"/>
  <rect x="280" y="92" width="440" height="474" fill="url(#a2Back)"/>

  <!-- кабанчик/елочка на задней стене -->
  <g stroke="#c9b394" stroke-width="1.5" opacity="0.55">
    <line x1="280" y1="178" x2="720" y2="178"/>
    <line x1="280" y1="264" x2="720" y2="264"/>
    <line x1="280" y1="350" x2="720" y2="350"/>
    <line x1="350" y1="92" x2="350" y2="566"/>
    <line x1="430" y1="92" x2="430" y2="566"/>
    <line x1="500" y1="92" x2="500" y2="566"/>
    <line x1="570" y1="92" x2="570" y2="566"/>
    <line x1="650" y1="92" x2="650" y2="566"/>
  </g>

  <!-- швы пола к VP -->
  <g stroke="#6f5a3f" stroke-width="2" opacity="0.4">
    <line x1="0" y1="720" x2="316" y2="566"/>
    <line x1="250" y1="720" x2="392" y2="566"/>
    <line x1="500" y1="720" x2="500" y2="566"/>
    <line x1="750" y1="720" x2="608" y2="566"/>
    <line x1="1000" y1="720" x2="684" y2="566"/>
    <line x1="150" y1="610" x2="850" y2="610"/>
  </g>

  <!-- душевая зона слева (зеркальная сторона относительно scene-after) -->
  <polygon points="280,150 280,566 388,620 388,210" fill="url(#a2Glass)"/>
  <polygon points="280,150 280,566 388,620 388,210" fill="none" stroke="#cfe6ea" stroke-width="2" opacity="0.45"/>
  <rect x="280" y="150" width="7" height="416" fill="#d8b878" opacity="0.85"/>
  <rect x="170" y="300" width="96" height="140" fill="#2a3a30"/>
  <rect x="186" y="318" width="22" height="40" rx="3" fill="#cdd6c8"/>
  <rect x="214" y="330" width="18" height="28" rx="3" fill="#b7c1b3"/>
  <ellipse cx="220" cy="150" rx="30" ry="6" fill="#d8b878"/>
  <rect x="216" y="156" width="8" height="24" fill="#d8b878"/>

  <!-- тёплое свечение -->
  <rect x="280" y="92" width="440" height="300" fill="url(#a2Warm)"/>

  <!-- прямоугольное зеркало с подсветкой -->
  <rect x="430" y="140" width="190" height="170" rx="10" fill="url(#a2MirrorGlow)" opacity="0.6" transform="translate(-15 -10)"/>
  <rect x="420" y="135" width="170" height="160" rx="8" fill="#0c0f11"/>
  <rect x="426" y="141" width="158" height="148" rx="6" fill="url(#a2Mirror)"/>
  <rect x="420" y="135" width="170" height="160" rx="8" fill="none" stroke="#ffe9c2" stroke-width="3" opacity="0.45"/>
  <path d="M445 250 q30 -40 70 -86" stroke="#cfe2e8" stroke-width="9" stroke-linecap="round" opacity="0.16" fill="none"/>

  <!-- тумба под дерево с двумя ящиками -->
  <rect x="392" y="430" width="226" height="86" rx="6" fill="url(#a2Wood)"/>
  <rect x="392" y="412" width="226" height="24" rx="4" fill="url(#a2Counter)"/>
  <line x1="505" y1="446" x2="505" y2="510" stroke="#5a3a20" stroke-width="2" opacity="0.6"/>
  <rect x="454" y="470" width="20" height="4" rx="2" fill="#2a2d30"/>
  <rect x="536" y="470" width="20" height="4" rx="2" fill="#2a2d30"/>
  <ellipse cx="505" cy="528" rx="138" ry="11" fill="#000" opacity="0.16"/>

  <!-- накладная раковина-чаша (vessel) -->
  <rect x="462" y="384" width="86" height="30" rx="10" fill="#ece4d6"/>
  <rect x="462" y="384" width="86" height="30" rx="10" fill="none" stroke="#cdbfa6" stroke-width="2"/>
  <ellipse cx="505" cy="388" rx="34" ry="6" fill="#d8cdb9"/>
  <path d="M505 384 L505 348 Q505 340 513 340 L532 340" fill="none" stroke="#23262a" stroke-width="6" stroke-linecap="round"/>

  <!-- декор -->
  <rect x="566" y="382" width="28" height="30" rx="4" fill="#caa46f"/>
  <g fill="#3a7a55">
    <path d="M580 382 q-20 -36 -6 -64 q12 24 6 64"/>
    <path d="M580 382 q20 -28 8 -56 q-14 24 -8 56"/>
  </g>
  <rect x="414" y="396" width="40" height="16" rx="8" fill="#e9d9b9"/>

  <!-- бра на правой стене -->
  <rect x="905" y="300" width="9" height="70" rx="4" fill="#d8b878"/>
  <circle cx="909" cy="292" r="12" fill="#fff4dc"/>

  <!-- ниша/полка на правой стене с полотенцами -->
  <rect x="800" y="420" width="120" height="60" fill="#caa46f" opacity="0.5"/>
  <rect x="812" y="430" width="40" height="40" rx="3" fill="#f0ece2"/>
  <rect x="860" y="430" width="40" height="40" rx="3" fill="#dcc7a8"/>

  <polygon points="300,92 700,92 690,80 310,80" fill="#fff3d8" opacity="0.5"/>
  <rect x="0" y="0" width="1000" height="720" fill="url(#a2Vignette)"/>
</svg>
