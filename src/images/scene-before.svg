<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Санузел до ремонта">
  <defs>
    <linearGradient id="bWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c8884"/>
      <stop offset="1" stop-color="#6f6a64"/>
    </linearGradient>
    <linearGradient id="bFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b655d"/>
      <stop offset="1" stop-color="#534e47"/>
    </linearGradient>
    <linearGradient id="bPipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a3f"/>
      <stop offset="0.5" stop-color="#c08a52"/>
      <stop offset="1" stop-color="#7d5430"/>
    </linearGradient>
  </defs>

  <!-- bare plaster wall -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#bWall)"/>
  <!-- patchy stains / unevenness -->
  <g fill="#000" opacity="0.06">
    <path d="M120 60 q60 20 30 90 q-50 40 -90 -10 q-10 -70 60 -80z"/>
    <path d="M640 120 q80 -10 70 70 q-30 60 -100 30 q-30 -70 30 -100z"/>
    <path d="M300 360 q70 30 20 100 q-70 20 -80 -40 q0 -50 60 -60z"/>
  </g>
  <g fill="#fff" opacity="0.05">
    <path d="M820 280 q50 20 10 70 q-50 10 -50 -40z"/>
    <path d="M180 470 q40 10 20 50 q-50 0 -40 -40z"/>
  </g>

  <!-- old broken tile remnants (lower band) -->
  <g opacity="0.85">
    <rect x="0" y="470" width="1000" height="130" fill="#7c8a86"/>
    <g stroke="#5f6b67" stroke-width="2" opacity="0.7">
      <line x1="60" y1="470" x2="60" y2="600"/>
      <line x1="120" y1="470" x2="120" y2="600"/>
      <line x1="180" y1="470" x2="180" y2="600"/>
      <line x1="300" y1="470" x2="300" y2="600"/>
      <line x1="0" y1="520" x2="280" y2="520"/>
      <line x1="0" y1="565" x2="240" y2="565"/>
    </g>
    <!-- chipped / missing tiles -->
    <rect x="180" y="520" width="60" height="45" fill="#6f6a64"/>
    <rect x="60" y="565" width="60" height="35" fill="#6f6a64"/>
    <rect x="600" y="470" width="80" height="50" fill="#6f6a64"/>
  </g>

  <!-- cracks -->
  <g stroke="#3f3b36" stroke-width="2" opacity="0.5" fill="none">
    <path d="M430 0 q20 120 -10 220 q30 80 0 180"/>
    <path d="M760 60 q-20 90 10 160"/>
  </g>

  <!-- floor with rubble -->
  <rect x="0" y="600" width="1000" height="120" fill="url(#bFloor)"/>
  <g fill="#7c756b">
    <path d="M120 660 l30 -14 l26 18 l-18 22 l-34 -6z"/>
    <path d="M420 690 l24 -10 l22 14 l-14 18 l-30 -4z"/>
    <path d="M700 650 l26 -12 l24 16 l-16 20 l-30 -6z"/>
    <circle cx="250" cy="678" r="10"/>
    <circle cx="560" cy="662" r="8"/>
  </g>
  <g fill="#5a544c" opacity="0.7">
    <circle cx="180" cy="700" r="6"/>
    <circle cx="480" cy="668" r="5"/>
    <circle cx="820" cy="692" r="7"/>
  </g>

  <!-- exposed pipes sticking from wall (center, where vanity will be) -->
  <g>
    <rect x="440" y="430" width="14" height="120" rx="3" fill="url(#bPipe)"/>
    <rect x="506" y="430" width="14" height="120" rx="3" fill="url(#bPipe)"/>
    <circle cx="447" cy="430" r="12" fill="#8a5e36"/>
    <circle cx="513" cy="430" r="12" fill="#8a5e36"/>
    <!-- water stain -->
    <ellipse cx="480" cy="600" rx="120" ry="12" fill="#3f3b36" opacity="0.25"/>
  </g>

  <!-- rough wiring where mirror will be -->
  <g stroke="#2b2723" stroke-width="3" fill="none" opacity="0.7">
    <path d="M470 150 q10 30 -8 46 q-14 16 4 30"/>
    <path d="M495 150 q-8 26 6 44"/>
  </g>
  <rect x="462" y="138" width="46" height="26" rx="3" fill="#4a443d"/>

  <!-- hanging bare bulb -->
  <line x1="700" y1="0" x2="700" y2="120" stroke="#2b2723" stroke-width="2"/>
  <circle cx="700" cy="134" r="16" fill="#d9c98f" opacity="0.85"/>
  <circle cx="700" cy="134" r="30" fill="#d9c98f" opacity="0.12"/>

  <!-- bucket + tools -->
  <g>
    <path d="M150 540 l70 0 l-8 60 l-54 0 z" fill="#43596b"/>
    <ellipse cx="185" cy="540" rx="35" ry="8" fill="#33485a"/>
    <path d="M156 540 q29 -22 58 0" fill="none" stroke="#8d949a" stroke-width="3"/>
  </g>
  <g stroke="#6b5536" stroke-width="6" stroke-linecap="round">
    <line x1="250" y1="600" x2="330" y2="540"/>
  </g>
  <rect x="318" y="520" width="40" height="24" rx="3" fill="#9aa0a4" transform="rotate(-36 338 532)"/>

  <!-- ladder hint (left) -->
  <g stroke="#7a6240" stroke-width="6" opacity="0.8">
    <line x1="70" y1="180" x2="40" y2="600"/>
    <line x1="150" y1="180" x2="170" y2="600"/>
    <line x1="64" y1="260" x2="156" y2="260"/>
    <line x1="58" y1="360" x2="160" y2="360"/>
    <line x1="52" y1="470" x2="166" y2="470"/>
  </g>
</svg>
