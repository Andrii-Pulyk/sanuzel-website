<!DOCTYPE html>
<html lang="{{meta.lang}}" dir="{{meta.dir}}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; base-uri 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0e11">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="description" content="{{page.meta_description}}">
    <meta property="og:title" content="{{page.title}}">
    <meta property="og:description" content="{{page.meta_description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{_canonical_url}}">
    <meta property="og:site_name" content="{{_site_name}}">
    <meta property="og:locale" content="{{meta.locale}}">
    <meta property="og:image" content="{{_og_image}}">
    <meta property="og:image:width" content="{{_og_image_width}}">
    <meta property="og:image:height" content="{{_og_image_height}}">
    <meta property="og:image:alt" content="{{page.title}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{page.title}}">
    <meta name="twitter:description" content="{{page.meta_description}}">
    <meta name="twitter:image" content="{{_og_image}}">
    <title>{{page.title}}</title>
    {{_hreflang_tags}}
    <link rel="canonical" href="{{_canonical_url}}">
    {{_structured_data}}
    <link rel="icon" type="image/svg+xml" href="{{_assets}}images/favicon.svg">
    <link rel="stylesheet" href="{{_assets}}css/style.css?v={{_asset_version}}">
</head>
