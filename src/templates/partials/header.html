    <header class="header" id="siteHeader">
        <div class="container">
            <a href="{{_nav_home_url}}" class="logo">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24"><path d="M4 13h16v1a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M7 13V7a2 2 0 0 1 4 0"/><line x1="7" y1="19.5" x2="7" y2="21"/><line x1="17" y1="19.5" x2="17" y2="21"/></svg>
                </span>
                <span class="logo-name"><b>Mistrz<span>Łazienek</span></b><small>{{footer.brand_tagline}}</small></span>
            </a>

            <nav class="nav" id="nav">
                <a href="{{_nav_home_url}}">{{nav.home}}</a>
                <a href="{{_nav_services_url}}">{{nav.services}}</a>
                <a href="{{_nav_works_url}}">{{nav.gallery}}</a>
                <a href="{{_nav_home_url}}#reviews">{{nav.reviews}}</a>
                <a href="{{_nav_contacts_url}}">{{nav.contacts}}</a>
                <div class="nav-messengers">
                    <a href="{{_whatsapp_url}}" class="contact-channel contact-channel-whatsapp" target="_blank" rel="noopener noreferrer" data-analytics-event="click_whatsapp" aria-label="{{nav.whatsapp}}">WhatsApp</a>
                    <a href="{{_telegram_url}}" class="contact-channel contact-channel-telegram" target="_blank" rel="noopener noreferrer" data-analytics-event="click_telegram" aria-label="{{nav.telegram}}">Telegram</a>
                </div>
                {{_lang_switcher_mobile}}
            </nav>

            <div class="header-side">
                {{_city_switcher}}
                <a href="tel:{{footer.phone_href}}" class="header-phone">
                    {{footer.phone}}<small>{{nav.phone_hint}}</small>
                </a>
                <div class="header-messengers">
                    <a href="{{_whatsapp_url}}" class="messenger-icon messenger-whatsapp" target="_blank" rel="noopener noreferrer" data-analytics-event="click_whatsapp" aria-label="{{nav.whatsapp}}" title="WhatsApp">WA</a>
                    <a href="{{_telegram_url}}" class="messenger-icon messenger-telegram" target="_blank" rel="noopener noreferrer" data-analytics-event="click_telegram" aria-label="{{nav.telegram}}" title="Telegram">TG</a>
                </div>
                <a href="{{_nav_contacts_url}}" class="btn btn-primary btn-header" data-analytics-event="click_contact_cta" data-analytics-label="{{nav.cta}}">{{nav.cta}}</a>
            </div>

            {{_lang_switcher}}

            <button class="menu-toggle" id="menuToggle" aria-label="{{nav.menu_aria}}" aria-controls="nav" aria-expanded="false" type="button">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
